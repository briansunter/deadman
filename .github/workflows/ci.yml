name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the locally verified passing baseline; avoid "latest" to
          # keep local and CI runtimes deterministic.
          bun-version: "1.3.3"

      - run: bun install --frozen-lockfile

      - run: bun run check
